name: Kiem tra lich BKE cuoi tuan (Ha Noi)

on:
  schedule:
    # 08:00 sáng giờ Việt Nam (UTC+7) = 01:00 UTC. Đổi giờ tại đây nếu muốn.
    - cron: "0 1 * * *"
  workflow_dispatch: {}   # cho phép bấm "Run workflow" để chạy thử thủ công

permissions:
  contents: write   # cần quyền này để commit lại state.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run BKE weekend checker
        env:
          ZALO_BOT_TOKEN: ${{ secrets.ZALO_BOT_TOKEN }}
          ZALO_CHAT_ID: ${{ secrets.ZALO_CHAT_ID }}
        run: python3 check_bke_weekend.py

      - name: Commit updated state (nếu có thay đổi)
        run: |
          git config user.name "bke-weekend-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update notified state [skip ci]"
          git push
